syntax = "proto3";

package forge.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/sevoniva-labs/velora/server/api/gen/go/forge/v1;forgev1";

service PortalService {
  rpc AuthorizePortalApplication(AuthorizePortalApplicationRequest) returns (AuthorizePortalApplicationResponse) {
    option (google.api.http) = {get: "/api/v1/auth/forward/{application_id}"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc ListPortalApplications(ListPortalApplicationsRequest) returns (ListPortalApplicationsResponse) {
    option (google.api.http) = {get: "/api/v1/portal/applications"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc GetPortalApplication(GetPortalApplicationRequest) returns (GetPortalApplicationResponse) {
    option (google.api.http) = {get: "/api/v1/portal/applications/{application_id}"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc LaunchPortalApplication(LaunchPortalApplicationRequest) returns (LaunchPortalApplicationResponse) {
    option (google.api.http) = {post: "/api/v1/portal/applications/{application_id}/launch" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc ListPortalFavorites(ListPortalFavoritesRequest) returns (ListPortalFavoritesResponse) {
    option (google.api.http) = {get: "/api/v1/portal/favorites"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc AddPortalFavorite(AddPortalFavoriteRequest) returns (AddPortalFavoriteResponse) {
    option (google.api.http) = {post: "/api/v1/portal/favorites" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc RemovePortalFavorite(RemovePortalFavoriteRequest) returns (RemovePortalFavoriteResponse) {
    option (google.api.http) = {delete: "/api/v1/portal/favorites/{application_id}"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc ListRecentPortalApplications(ListRecentPortalApplicationsRequest) returns (ListRecentPortalApplicationsResponse) {
    option (google.api.http) = {get: "/api/v1/portal/recent"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc ListPortalCategories(ListPortalCategoriesRequest) returns (ListPortalCategoriesResponse) {
    option (google.api.http) = {get: "/api/v1/portal/categories"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc ListPortalTags(ListPortalTagsRequest) returns (ListPortalTagsResponse) {
    option (google.api.http) = {get: "/api/v1/portal/tags"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc ListAdminPortalApplications(ListAdminPortalApplicationsRequest) returns (ListAdminPortalApplicationsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/portal/applications"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc CreatePortalApplication(CreatePortalApplicationRequest) returns (CreatePortalApplicationResponse) {
    option (google.api.http) = {post: "/api/v1/admin/portal/applications" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc UpdatePortalApplication(UpdatePortalApplicationRequest) returns (UpdatePortalApplicationResponse) {
    option (google.api.http) = {patch: "/api/v1/admin/portal/applications/{application_id}" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc DeletePortalApplication(DeletePortalApplicationRequest) returns (DeletePortalApplicationResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/portal/applications/{application_id}"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc CreatePortalCategory(CreatePortalCategoryRequest) returns (CreatePortalCategoryResponse) {
    option (google.api.http) = {post: "/api/v1/admin/portal/categories" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc UpdatePortalCategory(UpdatePortalCategoryRequest) returns (UpdatePortalCategoryResponse) {
    option (google.api.http) = {patch: "/api/v1/admin/portal/categories/{category_id}" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc DeletePortalCategory(DeletePortalCategoryRequest) returns (DeletePortalCategoryResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/portal/categories/{category_id}"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc CreatePortalTag(CreatePortalTagRequest) returns (CreatePortalTagResponse) {
    option (google.api.http) = {post: "/api/v1/admin/portal/tags" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc UpdatePortalTag(UpdatePortalTagRequest) returns (UpdatePortalTagResponse) {
    option (google.api.http) = {patch: "/api/v1/admin/portal/tags/{tag_id}" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc DeletePortalTag(DeletePortalTagRequest) returns (DeletePortalTagResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/portal/tags/{tag_id}"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
  rpc ReplacePortalApplicationPolicies(ReplacePortalApplicationPoliciesRequest) returns (ReplacePortalApplicationPoliciesResponse) {
    option (google.api.http) = {put: "/api/v1/admin/portal/applications/{application_id}/policies" body: "*"};
    option (openapi.v3.operation) = {security: [{additional_properties: [{name: "SessionCookie" value: {value: []}}, {name: "CsrfToken" value: {value: []}}]}, {additional_properties: [{name: "BearerAuth" value: {value: []}}]}]};
  }
}

message PortalApplication {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string name = 4;
  string description = 5;
  string icon = 6;
  string category_id = 7;
  string category_name = 8;
  string home_url = 9;
  string launch_url = 10;
  string launch_type = 11;
  string status = 12;
  int64 sort_order = 13;
  bool featured = 14;
  bool favorite = 15;
  int64 visit_count = 16;
  repeated PortalTag tags = 17;
  repeated PortalAccessPolicy policies = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

message PortalCategory {
  string id = 1;
  string organization_id = 2;
  string category_key = 3;
  string name = 4;
  string description = 5;
  string status = 6;
  int64 sort_order = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message PortalTag {
  string id = 1;
  string organization_id = 2;
  string tag_key = 3;
  string name = 4;
  int64 sort_order = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message PortalAccessPolicy {
  string id = 1;
  string application_id = 2;
  string policy_type = 3;
  string value = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListPortalApplicationsRequest {
  string keyword = 1;
  string category_id = 2;
  string tag_id = 3;
  bool favorites_only = 4;
  int32 limit = 5;
}
message AuthorizePortalApplicationRequest { string application_id = 1; }
message AuthorizePortalApplicationResponse {
  string application_id = 1;
  string user_id = 2;
  string login_name = 3;
  string organization_id = 4;
  string display_name = 5;
}
message ListPortalApplicationsResponse { repeated PortalApplication applications = 1; }
message GetPortalApplicationRequest { string application_id = 1; }
message GetPortalApplicationResponse { PortalApplication application = 1; }
message LaunchPortalApplicationRequest { string application_id = 1; }
message LaunchPortalApplicationResponse { PortalApplication application = 1; string launch_url = 2; }
message ListPortalFavoritesRequest { int32 limit = 1; }
message ListPortalFavoritesResponse { repeated PortalApplication applications = 1; }
message AddPortalFavoriteRequest { string application_id = 1; }
message AddPortalFavoriteResponse { PortalApplication application = 1; }
message RemovePortalFavoriteRequest { string application_id = 1; }
message RemovePortalFavoriteResponse {}
message ListRecentPortalApplicationsRequest { int32 limit = 1; }
message ListRecentPortalApplicationsResponse { repeated PortalApplication applications = 1; }
message ListPortalCategoriesRequest {}
message ListPortalCategoriesResponse { repeated PortalCategory categories = 1; }
message ListPortalTagsRequest {}
message ListPortalTagsResponse { repeated PortalTag tags = 1; }

message ListAdminPortalApplicationsRequest { int32 limit = 1; }
message ListAdminPortalApplicationsResponse { repeated PortalApplication applications = 1; }
message CreatePortalApplicationRequest {
  string code = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  string category_id = 5;
  string home_url = 6;
  string launch_url = 7;
  string launch_type = 8;
  string status = 9;
  int64 sort_order = 10;
  bool featured = 11;
  repeated string tag_ids = 12;
}
message CreatePortalApplicationResponse { PortalApplication application = 1; }
message UpdatePortalApplicationRequest {
  string application_id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  string category_id = 5;
  string home_url = 6;
  string launch_url = 7;
  string launch_type = 8;
  string status = 9;
  int64 sort_order = 10;
  bool featured = 11;
  repeated string tag_ids = 12;
}
message UpdatePortalApplicationResponse { PortalApplication application = 1; }
message DeletePortalApplicationRequest { string application_id = 1; }
message DeletePortalApplicationResponse {}
message CreatePortalCategoryRequest { string category_key = 1; string name = 2; string description = 3; int64 sort_order = 4; string status = 5; }
message CreatePortalCategoryResponse { PortalCategory category = 1; }
message UpdatePortalCategoryRequest { string category_id = 1; string name = 2; string description = 3; int64 sort_order = 4; string status = 5; }
message UpdatePortalCategoryResponse { PortalCategory category = 1; }
message DeletePortalCategoryRequest { string category_id = 1; }
message DeletePortalCategoryResponse {}
message CreatePortalTagRequest { string tag_key = 1; string name = 2; int64 sort_order = 3; }
message CreatePortalTagResponse { PortalTag tag = 1; }
message UpdatePortalTagRequest { string tag_id = 1; string name = 2; int64 sort_order = 3; }
message UpdatePortalTagResponse { PortalTag tag = 1; }
message DeletePortalTagRequest { string tag_id = 1; }
message DeletePortalTagResponse {}
message ReplacePortalApplicationPoliciesRequest { string application_id = 1; repeated PortalAccessPolicy policies = 2; }
message ReplacePortalApplicationPoliciesResponse { repeated PortalAccessPolicy policies = 1; }
