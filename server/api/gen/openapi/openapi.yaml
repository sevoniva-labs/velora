        SessionCookie:
            type: apiKey
            description: Interactive browser session. Mutating operations also require CsrfToken.
            name: velora_session
            in: cookie
        BearerAuth:
            type: http
            description: API token constrained by both account permissions and token scopes.
            scheme: bearer
            bearerFormat: Forge API Token
        CsrfToken:
            type: apiKey
            description: Double-submit token matching the velora_csrf cookie.
            name: X-CSRF-Token
            in: header
tags:
    - name: ApprovalService
    - name: IdentityService
    - name: PlatformService
    - name: PortalService
    - name: ReferenceSettlementService
      description: |-
        ReferenceSettlementService is the contract example for extracting a domain
         module from the modular monolith into an independently deployed Kratos service.
    - name: SystemService
      description: SystemService exposes liveness, readiness, and immutable build metadata.
