# Prometheus 采集配置（Phase A3 可观测性）。
# 用法：docker compose --profile monitoring up -d
# 采集目标：Velora server /metrics（compose 网络内 service 名 server:8080）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: velora
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8080"]
        labels:
          app: velora

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
