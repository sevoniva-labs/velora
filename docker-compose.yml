# Velora 本地开发 / 演示编排：PostgreSQL + Casdoor + Velora Server + Velora Web
# Redis 通过 --profile redis 可选启动（第一阶段未强制使用）。
#
# 中国大陆环境：可用 DOCKER_REGISTRY=docker.m.daocloud.io docker compose ... 加速拉取
# 官方源：        DOCKER_REGISTRY=docker.io docker compose ...
name: velora

x-registry: &registry "${DOCKER_REGISTRY:-docker.m.daocloud.io}"

services:
  postgres:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/library/postgres:16-alpine
    container_name: velora-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # 避免与本机已运行的 PostgreSQL（常见 5432）冲突，host 侧使用 5433。
      - "5433:5432"
    volumes:
      - velora-pgdata:/var/lib/postgresql/data
      # 首次初始化创建两个独立 database：velora / casdoor（数据严格隔离）
      - ./deployments/compose/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/library/redis:7-alpine
    container_name: velora-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - velora-redisdata:/data

  casdoor:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/casbin/casdoor:v1.762.0
    container_name: velora-casdoor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dbName: casdoor
      dataSourceName: "user=postgres password=postgres host=postgres port=5432 sslmode=disable dbname=casdoor"
      # 首次启动加载内置初始化数据（admin / built-in 应用）
      initData: "true"
      origin: "http://localhost:8443"
    ports:
      - "8443:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  server:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.server
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.m.daocloud.io}
    container_name: velora-server
    depends_on:
      postgres:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    environment:
      VELORA_ENV: development
      VELORA_APP_NAME: Velora
      # 默认由 Velora 承载登录表单，后端仅把凭据交给 Casdoor 校验并
      # 通过标准 OIDC ID Token 建立本地 session；Casdoor 页面不会暴露给用户。
      # 若要使用标准 Authorization Code + PKCE 跳转，可将
      # VELORA_CASDOOR_PASSWORD_LOGIN_ENABLED=false。
      VELORA_AUTH_MODE: ${VELORA_AUTH_MODE:-oidc}
      VELORA_OIDC_NAME: ${VELORA_OIDC_NAME:-casdoor}
      VELORA_OIDC_ISSUER: ${VELORA_OIDC_ISSUER:-http://localhost:8443}
      VELORA_OIDC_INTERNAL_URL: ${VELORA_OIDC_INTERNAL_URL:-http://casdoor:8000}
      VELORA_OIDC_CLIENT_ID: ${VELORA_OIDC_CLIENT_ID:-524bd6637c6116523eae}
      VELORA_OIDC_CLIENT_SECRET: ${VELORA_OIDC_CLIENT_SECRET:-}
      VELORA_OIDC_REDIRECT_URL: ${VELORA_OIDC_REDIRECT_URL:-http://localhost:5173/auth/callback}
      VELORA_OIDC_ALLOW_HTTP: "true"
      VELORA_CASDOOR_ACCOUNT_URL: ${VELORA_CASDOOR_ACCOUNT_URL:-http://localhost:8443/account}
      VELORA_CASDOOR_PASSWORD_LOGIN_ENABLED: ${VELORA_CASDOOR_PASSWORD_LOGIN_ENABLED:-true}
      VELORA_CASDOOR_APPLICATION: ${VELORA_CASDOOR_APPLICATION:-velora-local}
      VELORA_CASDOOR_ORGANIZATION: ${VELORA_CASDOOR_ORGANIZATION:-built-in}
      VELORA_TURNSTILE_SITE_KEY: ${VELORA_TURNSTILE_SITE_KEY:-}
      VELORA_TURNSTILE_SECRET: ${VELORA_TURNSTILE_SECRET:-}
      VELORA_TURNSTILE_SECRET_FILE: ${VELORA_TURNSTILE_SECRET_FILE:-}
      VELORA_TURNSTILE_HOSTNAMES: ${VELORA_TURNSTILE_HOSTNAMES:-}
      VELORA_TURNSTILE_ACTION: ${VELORA_TURNSTILE_ACTION:-login}
      VELORA_DATABASE_DSN: postgres://velora:velora@postgres:5432/velora?sslmode=disable
      VELORA_CRYPTO_KEY: ${VELORA_CRYPTO_KEY:-velora-local-development-key-change-me-32bytes}
      VELORA_BOOTSTRAP_ADMIN: ${VELORA_BOOTSTRAP_ADMIN:-admin}
      VELORA_BOOTSTRAP_PASSWORD: ${VELORA_BOOTSTRAP_PASSWORD:-change-me-development-only}
      VELORA_PUBLIC_URL: http://localhost:8080
      # 本地 Web 既支持 Vite 5173，也支持 Compose Nginx 8443；两种 loopback 主机名都显式允许。
      VELORA_ALLOWED_ORIGINS: ${VELORA_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8443,http://127.0.0.1:8443}
      VELORA_SECURE_COOKIES: "false"
      VELORA_WEB_DIR: /app/web
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/system/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.m.daocloud.io}
    container_name: velora-web
    depends_on:
      - server
    ports:
      - "5173:80"
    environment:
      VELORA_API_PROXY_PASS: http://server:8080
      VELORA_CASDOOR_PROXY_PASS: http://casdoor:8000/
      VELORA_DNS_RESOLVER: ${VELORA_DNS_RESOLVER:-127.0.0.11}
      VELORA_NGINX_RESOLVE_MODE: ${VELORA_NGINX_RESOLVE_MODE:-dynamic}

  # --- 可观测性（可选 profile：docker compose --profile monitoring up -d） ---
  prometheus:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/prom/prometheus:v2.53.3
    container_name: velora-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - velora-promdata:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  grafana:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/grafana/grafana:11.1.0
    container_name: velora-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - velora-grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  velora-pgdata:
  velora-redisdata:
  velora-promdata:
  velora-grafanadata:
