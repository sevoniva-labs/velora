limit_req_zone $binary_remote_addr zone=velora_login:10m rate=10r/m;
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name home.sevoniva.com auth.sevoniva.com demo.sevoniva.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name home.sevoniva.com;
    ssl_certificate /etc/nginx/certs/home.sevoniva.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/home.sevoniva.com/privkey.pem;
    include /etc/nginx/snippets/velora-tls.conf;
    include /etc/nginx/snippets/velora-security.conf;
    client_max_body_size 2m;

    location = /api/v1/auth/login {
        limit_req zone=velora_login burst=5 nodelay;
        set $upstream http://server:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location /api/ {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location = /healthz {
        access_log off;
        set $upstream http://server:8080/api/v1/system/ready;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name auth.sevoniva.com;
    ssl_certificate /etc/nginx/certs/auth.sevoniva.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/auth.sevoniva.com/privkey.pem;
    include /etc/nginx/snippets/velora-tls.conf;
    include /etc/nginx/snippets/velora-security.conf;
    client_max_body_size 1m;

    location = /_velora/session/bridge {
        access_log off;
        # This endpoint must preserve the original POST URI and body. A variable
        # proxy_pass changes URI processing semantics and can produce a 400
        # before the request reaches the application handler.
        proxy_pass http://server:8080;
        include /etc/nginx/snippets/velora-proxy.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    location / {
        set $upstream http://casdoor:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name demo.sevoniva.com;
    ssl_certificate /etc/nginx/certs/demo.sevoniva.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/demo.sevoniva.com/privkey.pem;
    include /etc/nginx/snippets/velora-tls.conf;
    include /etc/nginx/snippets/velora-security.conf;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        set $upstream http://oidc-demo:8090/healthz;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location / {
        set $upstream http://oidc-demo:8090;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
}
