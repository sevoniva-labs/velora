# Velora 告警规则（Phase A3）。
# 按方案要求覆盖：5xx 率、登录失败激增、DB 不可达、证书到期（由 blackbox 或外部实现）。
groups:
  - name: velora-availability
    rules:
      - alert: VeloraDown
        expr: up{job="velora"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Velora server 不可达"
          description: "Prometheus 无法抓取 velora /metrics 已超过 2 分钟。"

      - alert: Velora5xxRateHigh
        # forge_http_requests_total 是当前 Kratos 基座实际暴露的请求计数。
        expr: |
          sum(rate(forge_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(forge_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Velora 5xx 比例过高"
          description: "最近 5 分钟 HTTP 5xx 比例超过 5%。"

  - name: velora-security
    rules:
      - alert: LoginFailuresSpike
        expr: increase(forge_http_requests_total{route="/api/v1/auth/login",status=~"401|403|423"}[5m]) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "登录失败激增（疑似撞库）"
          description: "最近 5 分钟登录失败超过 30 次，可能为暴力破解攻击。"

      - alert: OidcFailureRateHigh
        expr: increase(forge_http_requests_total{route="/api/v1/auth/federated/oidc/:provider",status=~"4..|5.."}[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OIDC authorize 失败激增"
          description: "最近 5 分钟 OIDC authorize 失败超过 50 次。"

      - alert: WeChatIdentityFailuresHigh
        expr: |
          sum(increase(velora_identity_events_total{
            flow=~"wechat_(start|callback|bind|complete)",
            result=~"invalid_.*|.*_failed|replayed_.*|unbound"
          }[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "微信扫码登录异常增多"
          description: "最近 5 分钟微信扫码、绑定或会话完成异常超过 10 次。请检查 Casdoor、Redis 和微信开放平台状态。"

      - alert: WeChatIdentityLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le, flow) (
              rate(velora_identity_operation_duration_seconds_bucket{flow=~"wechat_(callback|bind|complete)"}[5m])
            )
          ) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "微信身份链路延迟过高"
          description: "微信扫码、绑定或登录完成链路 P95 延迟持续 10 分钟超过 3 秒。"

  - name: velora-runtime
    rules:
      - alert: VeloraHighGoroutines
        expr: velora_go_goroutines > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "goroutine 数量异常"
          description: "goroutine 数超过 2000 持续 10 分钟，可能存在泄漏。"
