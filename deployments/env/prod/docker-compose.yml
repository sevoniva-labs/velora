# Velora 独立生产编排。
# 不与根目录开发 Compose 合并，避免开发端口、默认凭据和 initData 继承到生产。
# 运行前复制 deployments/env/prod/.env.example 到安全位置，并由 Secret Manager/CI 注入真实值。
name: velora-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-env: &app-env
  VELORA_ENV: production
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  VELORA_PORT: "8080"
  PUBLIC_BASE_URL: "https://${VELORA_EXTERNAL_URL:?VELORA_EXTERNAL_URL is required}"
  DATABASE_URL: "${VELORA_DATABASE_URL:?VELORA_DATABASE_URL is required}"
  CASDOOR_ISSUER: "https://${VELORA_EXTERNAL_URL:?VELORA_EXTERNAL_URL is required}/casdoor"
  CASDOOR_CLIENT_ID: "${CASDOOR_CLIENT_ID:?CASDOOR_CLIENT_ID is required}"
  CASDOOR_CLIENT_SECRET: "${CASDOOR_CLIENT_SECRET:?CASDOOR_CLIENT_SECRET is required}"
  CASDOOR_REDIRECT_URI: "https://${VELORA_EXTERNAL_URL:?VELORA_EXTERNAL_URL is required}/api/v1/auth/oidc/callback"
  CASDOOR_DEFAULT_REDIRECT: "${CASDOOR_DEFAULT_REDIRECT:-/home}"
  SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
  SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-1}"
  COOKIE_SECURE: "true"
  COOKIE_DOMAIN: "${VELORA_COOKIE_DOMAIN:-}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}"
  REDIS_URL: "${REDIS_URL:?REDIS_URL is required}"
  MAIL_CREDENTIAL_KEY: "${MAIL_CREDENTIAL_KEY:?MAIL_CREDENTIAL_KEY is required}"
  MAIL_SYNC_INTERVAL_MINUTES: "${MAIL_SYNC_INTERVAL_MINUTES:-10}"
  HEALTH_CHECK_TIMEOUT_SECONDS: "${HEALTH_CHECK_TIMEOUT_SECONDS:-5}"
  VELORA_ADMIN_ROLE: "${VELORA_ADMIN_ROLE:-velora_admin}"
  TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
  TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"

services:
  postgres:
    image: "${DOCKER_REGISTRY:-docker.io}/library/postgres:16-alpine"
    container_name: velora-prod-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: "${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}"
      POSTGRES_DB: postgres
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}"
      POSTGRES_IDP_USER: "${POSTGRES_IDP_USER:?POSTGRES_IDP_USER is required}"
      POSTGRES_IDP_PASSWORD: "${POSTGRES_IDP_PASSWORD:?POSTGRES_IDP_PASSWORD is required}"
    volumes:
      - velora-prod-pgdata:/var/lib/postgresql/data
      - ../../compose/init-db-prod.sh:/docker-entrypoint-initdb.d/10-init-db-prod.sh:ro
    expose:
      - "5432"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: "${DOCKER_REGISTRY:-docker.io}/library/redis:7-alpine"
    container_name: velora-prod-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - velora-prod-redisdata:/data
    expose:
      - "6379"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  casdoor:
    image: "${DOCKER_REGISTRY:-docker.io}/casbin/casdoor:v1.762.0"
    container_name: velora-prod-casdoor
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dbName: casdoor
      dataSourceName: "${CASDOOR_DATA_SOURCE_NAME:?CASDOOR_DATA_SOURCE_NAME is required}"
      initData: "false"
      origin: "https://${VELORA_EXTERNAL_URL:?VELORA_EXTERNAL_URL is required}/casdoor"
    expose:
      - "8000"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  server:
    container_name: velora-prod-server
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.server
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.io}"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      casdoor:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env
    expose:
      - "8080"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    container_name: velora-prod-web
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.web
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.io}"
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    environment:
      VELORA_API_PROXY_PASS: http://server:8080
      VELORA_TLS_ENABLED: "true"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: "${DOCKER_REGISTRY:-docker.io}/prom/prometheus:v2.53.3"
    container_name: velora-prod-prometheus
    restart: unless-stopped
    logging: *default-logging
    profiles: [monitoring]
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - velora-prod-promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    expose:
      - "9090"
    networks:
      - app

  grafana:
    image: "${DOCKER_REGISTRY:-docker.io}/grafana/grafana:11.1.0"
    container_name: velora-prod-grafana
    restart: unless-stopped
    logging: *default-logging
    profiles: [monitoring]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required when monitoring is enabled}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required when monitoring is enabled}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - velora-prod-grafanadata:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - app

volumes:
  velora-prod-pgdata:
  velora-prod-redisdata:
  velora-prod-promdata:
  velora-prod-grafanadata:

networks:
  edge:
  app:
    internal: true
