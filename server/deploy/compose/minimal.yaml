services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an internal Harbor digest}
    environment:
      POSTGRES_DB: velora
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  velora:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${VELORA_NODE_IMAGE:?set internal Node image digest}
        GO_IMAGE: ${VELORA_GO_IMAGE:?set internal Go image digest}
        RUNTIME_IMAGE: ${VELORA_RUNTIME_IMAGE:?set internal runtime image digest}
    ports:
      - "8080:8080"
    environment:
      VELORA_CONFIG: /app/config.yaml
      VELORA_DATABASE_PROVIDER: postgres
      VELORA_DATABASE_DSN: postgres://velora:velora_dev@postgres:5432/velora?sslmode=disable
      VELORA_CRYPTO_KEY: ${VELORA_CRYPTO_KEY:?set VELORA_CRYPTO_KEY in .env}
      VELORA_BOOTSTRAP_ADMIN: ${VELORA_BOOTSTRAP_ADMIN:-admin}
      VELORA_BOOTSTRAP_PASSWORD: ${VELORA_BOOTSTRAP_PASSWORD:?set VELORA_BOOTSTRAP_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
