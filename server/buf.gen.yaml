version: v2
clean: true
plugins:
  - local: .tools/bin/protoc-gen-go
    out: api/gen/go
    opt:
      - paths=source_relative
  - local: .tools/bin/protoc-gen-go-grpc
    out: api/gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
  - local: .tools/bin/protoc-gen-go-http
    out: api/gen/go
    opt:
      - paths=source_relative
  - local: .tools/bin/protoc-gen-openapi
    out: api/gen/openapi
    opt:
      - fq_schema_naming=true
      - default_response=false
