{{- if and .Values.config.webCSPWujieEnabled (empty .Values.config.webCSPWujieApprovalRef) -}}
{{- fail "config.webCSPWujieEnabled requires config.webCSPWujieApprovalRef" -}}
{{- end -}}
{{- if and (not .Values.config.webCSPWujieEnabled) (not (empty .Values.config.webCSPWujieApprovalRef)) -}}
{{- fail "config.webCSPWujieApprovalRef requires config.webCSPWujieEnabled=true" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "velora.fullname" . }}
  labels:
    {{- include "velora.selectorLabels" . | nindent 4 }}
