message PortalApplication {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string name = 4;
  string description = 5;
  string icon = 6;
  string category_id = 7;
  string category_name = 8;
  string home_url = 9;
  string launch_url = 10;
  string launch_type = 11;
  string status = 12;
  int64 sort_order = 13;
  bool featured = 14;
  bool favorite = 15;
  int64 visit_count = 16;
  repeated PortalTag tags = 17;
  repeated PortalAccessPolicy policies = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  string lifecycle_status = 21;
  int64 config_version = 22;
  google.protobuf.Timestamp published_at = 23;
  string published_by = 24;
  string owner_user_id = 25;
  string owner_user_name = 26;
  string owner_department_id = 27;
  string owner_department_name = 28;
}

message PortalCategory {
  string id = 1;
  string organization_id = 2;
  string category_key = 3;
  string name = 4;
  string description = 5;
  string status = 6;
  int64 sort_order = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message PortalTag {
  string id = 1;
  string organization_id = 2;
  string tag_key = 3;
  string name = 4;
  int64 sort_order = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message PortalAccessPolicy {
  string id = 1;
  string application_id = 2;
  string policy_type = 3;
  string value = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
message PortalApplicationAccessGrant {
  string id = 1;
  string application_id = 2;
  string subject_type = 3;
  string subject_id = 4;
  string subject_name = 5;
  bool include_descendants = 6;
  string effect = 7;
  repeated string roles = 8;
  google.protobuf.Timestamp valid_from = 9;
  google.protobuf.Timestamp valid_until = 10;
  string status = 11;
  string reason = 12;
  int64 version = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}
message PortalApplicationEffectiveAccess {
  string user_id = 1;
  string login_name = 2;
  string display_name = 3;
  repeated string roles = 4;
  repeated string source_grant_ids = 5;
}
message PortalApplicationAccessImpact {
  int64 effective_users = 1;
  int64 added_users = 2;
  int64 revoked_users = 3;
  int64 role_changed_users = 4;
  int64 privileged_users = 5;
  int64 provisioning_tasks = 6;
}
message PortalApplicationRole {
  string id = 1;
  string application_id = 2;
  string role_key = 3;
  string name = 4;
  string description = 5;
  string risk_level = 6;
  string status = 7;
  int64 config_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
message PortalApplicationProvisioningTarget {
  string id = 1;
  string application_id = 2;
  string endpoint_url = 3;
  string signing_algorithm = 4;
  string secret_fingerprint = 5;
  int64 active_key_version = 6;
  int64 previous_key_version = 7;
  google.protobuf.Timestamp previous_valid_until = 8;
  string delivery_status = 9;
  google.protobuf.Timestamp last_success_at = 10;
  google.protobuf.Timestamp last_failure_at = 11;
  string last_error_code = 12;
  int64 config_version = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}
message RetryPortalApplicationProvisioningRequest { string application_id = 1; }
message RetryPortalApplicationProvisioningResponse { int32 retried_messages = 1; PortalApplicationProvisioningTarget target = 2; }
message PortalApplicationOnboardingCheck { string id = 1; string application_id = 2; int64 config_version = 3; string check_type = 4; string result = 5; string error_code = 6; string evidence_json = 7; string request_id = 8; string verified_by = 9; google.protobuf.Timestamp occurred_at = 10; }

message ListPortalApplicationsRequest {
