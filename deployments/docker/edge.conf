limit_req_zone $binary_remote_addr zone=velora_login:10m rate=10r/m;
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name home.sevoniva.com auth.sevoniva.com demo.sevoniva.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name home.sevoniva.com;
    ssl_certificate /etc/nginx/certs/home.sevoniva.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/home.sevoniva.com/privkey.pem;
    include /etc/nginx/snippets/velora-tls.conf;
    include /etc/nginx/snippets/velora-security.conf;
    client_max_body_size 2m;

    location = /_velora/logout {
        access_log off;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        alias /usr/share/nginx/html/auth-logout.html;
    }
    location = /_velora/auth-logout.js {
        access_log off;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/auth-logout.js;
    }

    location = /api/v1/auth/login {
        limit_req zone=velora_login burst=5 nodelay;
        set $upstream http://server:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location /api/ {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location = /healthz {
        access_log off;
        set $upstream http://server:8080/api/v1/system/ready;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name auth.sevoniva.com;
    ssl_certificate /etc/nginx/certs/auth.sevoniva.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/auth.sevoniva.com/privkey.pem;
    include /etc/nginx/snippets/velora-tls.conf;
    include /etc/nginx/snippets/velora-security.conf;
    client_max_body_size 1m;

    # Every downstream OIDC request enters the Velora authorization gateway.
    # Casdoor remains the protocol engine but is never the interactive login UI.
    location = /login/oauth/authorize {
        set $gateway_upstream http://server:8080/_velora/authorize;
        proxy_pass $gateway_upstream$is_args$args;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location = /_velora/casdoor-authorize {
        internal;
        set $casdoor_authorize_upstream http://casdoor:8000/login/oauth/authorize;
        proxy_pass $casdoor_authorize_upstream$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /_velora/logout {
        access_log off;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        alias /usr/share/nginx/html/auth-logout.html;
    }
    location = /_velora/auth-logout.js {
        access_log off;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/auth-logout.js;
    }

    location = /_velora/session/bridge {
        access_log off;
        # Keep Docker DNS resolution dynamic while explicitly preserving the
        # original URI. The generic proxy snippet is intentionally not used:
        # its upgrade Connection header makes Go reject this form POST.
        set $bridge_upstream http://server:8080;
        proxy_pass $bridge_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    location = /_velora/session/logout {
        access_log off;
        set $logout_upstream http://server:8080;
        proxy_pass $logout_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Public identity host exposes protocol endpoints only. Casdoor's SPA,
    # account pages and management APIs are deliberately unreachable here.
    location = /.well-known/openid-configuration {
	set $upstream http://casdoor:8000;
	proxy_pass $upstream$request_uri;
	include /etc/nginx/snippets/velora-proxy.conf;
	limit_except GET { deny all; }
	}
	location = /.well-known/jwks {
		set $upstream http://casdoor:8000;
		proxy_pass $upstream$request_uri;
		include /etc/nginx/snippets/velora-proxy.conf;
		limit_except GET { deny all; }
	}
	location = /api/login/oauth/access_token {
		set $upstream http://casdoor:8000;
		proxy_pass $upstream$request_uri;
		include /etc/nginx/snippets/velora-proxy.conf;
		limit_except POST { deny all; }
	}
	location = /api/userinfo {
		set $upstream http://casdoor:8000;
		proxy_pass $upstream$request_uri;
		include /etc/nginx/snippets/velora-proxy.conf;
		limit_except GET POST { deny all; }
	}
	location = /api/logout {
        set $upstream http://casdoor:8000;
		proxy_pass $upstream$request_uri;
		include /etc/nginx/snippets/velora-proxy.conf;
		limit_except POST { deny all; }
	}
	location / {
		return 404;
    }
}

server {
    listen 443 ssl;
    server_name demo.sevoniva.com;
    ssl_certificate /etc/nginx/certs/demo.sevoniva.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/demo.sevoniva.com/privkey.pem;
    include /etc/nginx/snippets/velora-tls.conf;
    include /etc/nginx/snippets/velora-security.conf;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        set $upstream http://oidc-demo:8090/healthz;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
    location / {
        set $upstream http://oidc-demo:8090;
        proxy_pass $upstream;
        include /etc/nginx/snippets/velora-proxy.conf;
    }
}
